<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020713">
<title>TiTaN — Sign in</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{--blue:#078cff;--muted:#94b0dc;--border:rgba(24,105,218,.48)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:30px 18px;overflow:hidden;position:relative;isolation:isolate;color:#f5f8ff;background:radial-gradient(ellipse at 50% 47%,rgba(3,18,44,.13),transparent 48%),linear-gradient(112deg,#020611 0%,#020713 54%,#020611 100%)}
.bg-art{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.page{width:100%;display:flex;align-items:center;flex-direction:column;gap:35px;position:relative}
.brand{display:flex;align-items:center;flex-direction:column;text-align:center;margin-top:-1px}
.brand-logo{width:88px;height:70px;object-fit:contain;display:block;margin-bottom:7px;filter:drop-shadow(0 0 8px rgba(0,92,255,.25))}
.brand-name{font-size:25px;font-weight:600;letter-spacing:.37em;padding-left:.37em;line-height:1.3;color:#f7f9ff}
.card{width:min(100%,405px);padding:22px 25px 27px;border:1px solid rgba(22,88,177,.58);border-radius:13px;background:linear-gradient(145deg,rgba(3,11,26,.86),rgba(2,8,20,.78));box-shadow:0 20px 65px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.012);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.subtitle{margin:0 0 24px;text-align:center;font-size:11px;color:#a9c5ef;font-weight:400}
form{display:grid;gap:14px}
.field{height:42px;display:flex;align-items:center;gap:12px;padding:0 13px;border:1px solid rgba(55,92,150,.45);border-radius:9px;background:rgba(12,25,47,.74);transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:#168dff;box-shadow:0 0 0 3px rgba(0,119,255,.1)}
.field>svg{width:17px;height:17px;flex-shrink:0;stroke:#edf5ff}
.field input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#f6f8ff;font:400 11px Inter,sans-serif}
.field input::placeholder{color:#c1d0e7;opacity:1}
.toggle{border:0;background:transparent;color:#e6f1ff;padding:2px;display:grid;place-items:center;cursor:pointer}
.toggle svg{width:17px;height:17px}
.login{height:43px;margin-top:1px;border:0;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:14px;color:white;background:linear-gradient(105deg,#0aa6f5 0%,#0648ff 100%);font:500 13px Inter,sans-serif;cursor:pointer;transition:filter .2s,transform .2s}
.login:hover{filter:brightness(1.1)}.login:active{transform:translateY(1px)}
.login svg{width:17px;height:17px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}
.link{min-width:0;height:42px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px;border:1px solid #078fff;border-radius:9px;color:#f4f8ff;text-decoration:none;background:rgba(3,14,30,.56);font-size:10px;font-weight:500;white-space:nowrap;transition:background .2s,box-shadow .2s}
.link:hover{background:rgba(0,117,255,.1);box-shadow:0 0 16px rgba(0,126,255,.1)}
.link .service{width:19px;height:19px;flex-shrink:0;color:#10aaff}
.link .arrow{width:13px;height:13px;flex-shrink:0;color:#dcecff}
.footer{margin:30px 0 0;text-align:center;color:#91acd4;font-size:10px}
.footer span{margin:0 9px;color:#5275a8}
@media(max-width:480px){body{padding:26px 17px}.page{gap:28px}.brand-logo{width:78px;height:62px}.brand-name{font-size:23px}.card{padding:21px 17px 24px}.links{gap:8px}.link{gap:6px;font-size:9px;padding:0 5px}.link .service{width:17px;height:17px}}
@media(max-width:340px){.link .arrow{display:none}.card{padding-inline:13px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 <section class="card" aria-label="Sign in form">

   <label class="field"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7.5" r="4"/><path d="M4 21v-2.2a5 5 0 0 1 5-5h6a5 5 0 0 1 5 5V21Z"/></svg><input name="username" type="text" placeholder="Username or Email" autocomplete="username" required></label>

<script>
const password=document.getElementById('password');
const toggle=document.getElementById('togglePassword');
const eye=document.getElementById('eyeIcon');
toggle.addEventListener('click',()=>{
 const reveal=password.type==='password';
 password.type=reveal?'text':'password';
 toggle.setAttribute('aria-label',reveal?'Hide password':'Show password');
 toggle.title=reveal?'Hide password':'Show password';
 eye.innerHTML=reveal
 ?'<path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.8"/><path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 3-.5"/>'
 :'<path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>';
});
const form=document.getElementById('loginForm');
const message=document.querySelector('.subtitle');
const defaultMessage=message.textContent;
const submitButton=form.querySelector('.login');
const submitLabel=submitButton.querySelector('span');
let submitting=false;
form.addEventListener('input',()=>{if(!submitting)message.textContent=defaultMessage;});
form.addEventListener('submit',async event=>{
 event.preventDefault();
 if(submitting)return;
 submitting=true;
 submitButton.disabled=true;
 submitButton.setAttribute('aria-busy','true');
 submitLabel.textContent='Signing in…';
 message.textContent='Signing in securely…';
 let authenticated=false;
 try{
  const credentials=Object.fromEntries(new FormData(form).entries());
  const response=await fetch('/api/login',{
   method:'POST',
   credentials:'same-origin',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify(credentials)
  });
  const data=await response.json().catch(()=>({}));
  if(response.ok&&data.ok){
   authenticated=true;
   window.location.assign('/dashboard');
   return;
  }
  const detail=String(data.detail||'');
  if(response.status===429&&detail.startsWith('locked:')){
   const seconds=Math.max(1,parseInt(detail.split(':')[1]||'60',10)||60);
   message.textContent=`Too many failed attempts. Try again in ${seconds} seconds.`;
  }else if(response.status===401){
   message.textContent='Invalid username or password.';
  }else{
   message.textContent='Sign-in failed. Please try again.';
  }
 }catch(error){
  console.error(error);
  message.textContent='Could not connect. Please try again.';
 }finally{
  if(!authenticated){
   submitting=false;
   submitButton.disabled=false;
   submitButton.removeAttribute('aria-busy');
   submitLabel.textContent='Login';
  }
 }
});
</script>
